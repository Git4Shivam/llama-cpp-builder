name: Build No-AVX Wheel
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Setup CUDA 12.1
        uses: Jimver/cuda-toolkit@v0.2.17
        with:
          cuda: '12.1.0'
          
      - name: Install Build Dependencies
        run: pip install wheel setuptools cmake scikit-build-core
        
      - name: Compile Wheel (No AVX)
        env:
          CMAKE_ARGS: "-DLLAMA_AVX2=OFF -DLLAMA_AVX=OFF -DLLAMA_F16C=OFF -DLLAMA_FMA=OFF -DLLAMA_CUDA=on"
          FORCE_CMAKE: "1"
        run: pip wheel llama-cpp-python==0.3.20
        
      - name: Upload Finished Wheel
        uses: actions/upload-artifact@v4
        with:
          name: custom-llama-wheel
          path: "*.whl"
