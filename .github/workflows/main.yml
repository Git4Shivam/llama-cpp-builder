name: Build No-AVX Wheel
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'

      - name: Upgrade pip and core build tools
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Install CUDA 12.6 (direct, no third-party action)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerUrl = "https://developer.download.nvidia.com/compute/cuda/12.6.3/network_installers/cuda_12.6.3_windows_network.exe"
          $installerPath = "$env:TEMP\cuda_installer.exe"
          Write-Host "Downloading CUDA network installer..."
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath

          $components = "nvcc_12.6 cudart_12.6 cublas_12.6 cublas_dev_12.6 visual_studio_integration_12.6"
          Write-Host "Installing CUDA components: $components"
          Start-Process -FilePath $installerPath -ArgumentList "-s $components" -Wait -NoNewWindow

          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.6"
          if (-not (Test-Path "$cudaPath\bin\nvcc.exe")) {
            throw "CUDA install failed — nvcc.exe not found at $cudaPath\bin"
          }
          Write-Host "CUDA installed at: $cudaPath"
          Add-Content -Path $env:GITHUB_ENV -Value "CUDA_PATH=$cudaPath"
          Add-Content -Path $env:GITHUB_ENV -Value "CUDA_HOME=$cudaPath"
          Add-Content -Path $env:GITHUB_PATH -Value "$cudaPath\bin"

      - name: Setup MSVC Compiler environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify nvcc and environment
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          nvcc --version

      - name: Clean CMake cache
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "build"

      - name: Install build dependencies
        run: python -m pip install wheel setuptools cmake scikit-build-core ninja

      - name: Show CMake & MSVC versions
        shell: pwsh
        run: |
          cmake --version
          $clPath = Get-Command cl.exe -ErrorAction SilentlyContinue
          if (-not $clPath) {
            throw "cl.exe not found on PATH — MSVC environment setup failed."
          }
          Write-Host "Found cl.exe at: $($clPath.Source)"
          Write-Host "All 'ninja' matches on PATH:"
          Get-Command ninja -All -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Source }

      - name: Compile Wheel (No AVX) and build with CUDA
        shell: pwsh
        run: |
          $pySysPath = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $ninjaExe = Join-Path $pySysPath "ninja.exe"
          if (-not (Test-Path $ninjaExe)) {
            $ninjaCmd = Get-Command ninja -ErrorAction SilentlyContinue
            if (-not $ninjaCmd) { throw "ninja not found anywhere." }
            $ninjaExe = $ninjaCmd.Source
          }
          Write-Host "Forcing CMAKE_MAKE_PROGRAM to: $ninjaExe"

          $env:CMAKE_GENERATOR = "Ninja"
          $env:CMAKE_ARGS = "-DGGML_AVX2=OFF -DGGML_AVX=OFF -DGGML_F16C=OFF -DGGML_FMA=OFF -DGGML_CUDA=ON -DGGML_CUDA_ARCHITECTURES=86 -DCMAKE_MAKE_PROGRAM=`"$ninjaExe`" -DCMAKE_CUDA_FLAGS=`"-allow-unsupported-compiler`""
          $env:FORCE_CMAKE = "1"
          $env:CUDACXX = "$env:CUDA_PATH\bin\nvcc.exe"

          Write-Host "CMAKE_ARGS=$env:CMAKE_ARGS"

          python -m pip wheel llama-cpp-python==0.3.16 --no-deps --verbose

      - name: List created artifacts
        shell: pwsh
        run: |
          Write-Host "Created wheel files:"
          $wheels = Get-ChildItem -Name "llama_cpp_python-*.whl" -ErrorAction SilentlyContinue
          if (-not $wheels) {
            throw "No llama_cpp_python wheel found — build likely failed."
          }
          $wheels

      - name: Upload Finished Wheel
        uses: actions/upload-artifact@v4
        with:
          name: custom-llama-wheel
          path: "llama_cpp_python-*.whl"
